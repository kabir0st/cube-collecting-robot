camera:
  width: 640
  height: 480
  fps_target: 12
  focal_length_px: 650.0
  grab_bottom_region_ratio: 0.20
  grab_bottom_fill_ratio: 0.75
  capture_distance_mm: 100.0
  capture_bearing_tol_rad: 0.12
  retention_distance_mm: 150.0
  show_debug_view: true

robot:
  # Global speed multiplier applied to every linear/angular velocity cap
  # AND acceleration limit. 1.0 = original tuned baseline. 1.875 was the
  # last hard-coded value. Increase for a snappier robot; decrease for
  # bench-safe slow motion. The motion stack stays in proportion — cruise
  # time has the same shape, just stretched/compressed in time.
  #
  # Soft ceiling with the current chassis caps (~504 mm/s, ~5.45 rad/s)
  # is ~3.6 before omega starts clipping on sharp turns; main() hard-clamps
  # to 5.0 with a warning if exceeded.
  speed: 1.875

  # All extents measured from the LIDAR mount point (= the tracked pose
  # center used by cox / KF / odometry). Used for wall-clearance and home
  # placement math. Update if the robot is rebuilt.
  back_extent_mm:  150.0   # rear of chassis behind LIDAR
  left_extent_mm:   70.0
  right_extent_mm:  70.0
  # Front extent (with arm extended + held box) = arm_length_mm + 30 mm.

mission:
  # Home is centered on the robot's starting pose (the localization
  # origin (0, 0, 0)). Only the zone size and arm geometry are tunable.
  home_margin_mm: 152.4   # 0.5 ft — radius of the 1 ft home zone
  arm_length_mm: 80.0     # LIDAR center -> arm tip (held box position)

map:
  # The reference map is built from ~50 lidar frames at boot via RANSAC.
  # No hardcoded geometry — walls are whatever the lidar finds.
  #
  # Tuned for a RECTANGULAR ARENA with 1-2 other robots inside:
  #   - Walls are long & straight: tight inlier gate, high inlier req.
  #   - Other robots span ~5-15 angle bins (300-500 mm of arc); we don't
  #     want them mis-fit as walls. Long min_segment_len + high
  #     inlier_points_req filters them out.
  #   - Robots can occlude wall sections; max_lines > 4 gives slack so a
  #     wall split into two visible pieces still both fit.
  ransac:
    # Tight gate — arena walls are straight; tolerate a couple cm of
    # lidar noise but no more.
    inlier_thresh_mm: 50.0
    # More trials per line so the partial-occlusion case (robot blocking
    # the middle of a wall) still finds the dominant line.
    max_iters_per_line: 500
    # A small robot contributes ~5-15 angle-averaged points. Requiring 30
    # rejects robot bodies while passing partially-occluded walls.
    inlier_points_req: 30
    # ~360 angle bins; a wall ≈ 60-100 bins (≈ 17-28% of points). 6%
    # rejects robots (≈ 1-4%) and stops RANSAC once walls are exhausted.
    min_inlier_fraction: 0.06
    # 4 walls expected, +2 slack for occlusion-split walls.
    max_lines: 6
    endpoint_padding_mm: 50.0
    # Robot body footprint ≤ ~400 mm. 600 mm rejects robot edges while
    # accepting any plausible arena wall.
    min_segment_len_mm: 600.0

logger:
  # Lab-3 file logging (logs/<run_id>_{odom,cox,kalman}.txt).
  files_enabled: true
  # Lab-4 UDP stream to Matlab listener.
  udp_enabled: true
  out_dir: logs
  udp_host: 10.179.209.142
  udp_port: 5005
  tick_ms: 100
  # Take every N-th lidar beam for the UDP scan overlay. 1 = full ~360 pts,
  # 2 = ~180 pts (default; keeps each datagram under one MTU).
  scan_subsample: 2

battery:
  enabled: true
