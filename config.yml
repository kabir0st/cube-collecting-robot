camera:
  width: 640
  height: 480
  fps_target: 12
  focal_length_px: 650.0
  grab_bottom_region_ratio: 0.25
  grab_bottom_fill_ratio: 0.50
  grab_angle_tol_deg: 5.0
  capture_distance_mm: 100.0
  capture_bearing_tol_rad: 0.12
  retention_distance_mm: 150.0
  show_debug_view: true

robot:
  speed: 4.0
  back_extent_mm:  150.0   # rear of chassis behind LIDAR
  left_extent_mm:   70.0
  right_extent_mm:  70.0

mission:
  # Home is centered on the robot's starting pose (the localization
  # origin (0, 0, 0)). Only the zone size and arm geometry are tunable.
  home_margin_mm: 100   # 0.5 ft — radius of the 1 ft home zone
  arm_length_mm: 225.0     # LIDAR center -> arm tip (held box position)
  # Lab-3 single-shot goto target: "x_mm,y_mm,theta_deg". Uncomment to
  # override the default SEARCH mission and drive once to (x, y, theta).
  # State machine latches DONE on arrival; the process keeps running
  # until SIGINT so the data logger can finish writing.
  # goto: "400,0,0"

map:
  # The reference map is built from ~50 lidar frames at boot via RANSAC.
  # No hardcoded geometry — walls are whatever the lidar finds.
  #
  # Tuned for a 2.4m × 3.6m rectangular arena with home on a 2.4m short
  # wall and 1-2 other robots inside the arena.
  #
  # Boot geometry — robot at home = (0, 0, 0) facing into the arena (+x
  # along the 3.6m axis, +y across the 2.4m axis):
  #   - Home wall  (2.4m):  behind robot, x ≈ -200   (close, ~150 beams)
  #   - Far wall   (2.4m):  ahead of robot, x ≈ +3400 (farthest, ~40 beams)
  #   - Side walls (3.6m):  y ≈ ±1200                 (~80 beams each)
  # ~360 lidar beams total. The far wall is the limiting case for both
  # inlier_points_req and min_inlier_fraction; the home wall (close,
  # high beam count) is what max_lines + endpoint_padding most need to
  # not over-split.
  #
  # Other robots span ~5-15 beams (300-500 mm of chord). Body footprint
  # ≤ ~400 mm. We want them rejected even if they happen to present a
  # flat edge — min_segment_len does the heavy lifting here since the
  # shortest real wall is 2400 mm.
  ransac:
    # Lab arena walls are flat MDF/wood; lidar noise ≈ 5-10 mm at these
    # ranges. Tightened from a generic 50 mm so anything outside the
    # gate is sensor flicker or a non-wall object, not a noisy wall.
    inlier_thresh_mm: 30.0
    # More trials per line so the partial-occlusion case (robot parked
    # at the midspan of a side wall) still finds the dominant line.
    # Boot-only work; CPU is free here.
    max_iters_per_line: 500
    # Was 30 (a "far wall ~40 beams with slack" floor). Empirically the
    # close-behind wall (~263 mm) plus 2-3 other robots in the arena
    # leaves the far walls with 18-25 useful beams after occlusion.
    # 18 still beats any single robot's chassis arc (~5-15 beams) plus
    # the min_segment_len_mm gate below catches anything shorter than a
    # real wall.
    inlier_points_req: 18
    # Was 0.08 (8 %). With ~3500 aggregated points after angle binning,
    # 8 % required ~280 inliers per line — fine for the first two walls
    # but starves RANSAC of the remaining walls once those points are
    # erased. 0.04 (~140 inliers) keeps it going long enough to find
    # walls 3 and 4, then naturally stops when only sensor noise remains.
    min_inlier_fraction: 0.04
    # 4 walls expected, +2 slack so a side wall split into two visible
    # pieces by a robot at midspan still both fit.
    max_lines: 6
    endpoint_padding_mm: 50.0
    # Was 1200 mm. Shortest full wall is 2400 mm; with several arena
    # robots occluding a single wall it can split into two ~700-900 mm
    # pieces. 800 mm still beats a 400 mm robot chassis by 2x while
    # preserving the heavily-occluded long walls. min_inlier_fraction
    # + inlier_thresh_mm are the safety net against a flat chassis edge
    # masquerading as a wall.
    min_segment_len_mm: 800.0

logger:
  # Lab-3 file logging (logs/<run_id>_{odom,cox,kalman}.txt).
  files_enabled: true
  # Lab-4 UDP stream to Matlab listener.
  udp_enabled: true
  out_dir: logs
  udp_host: 10.98.151.142
  udp_port: 5005
  tick_ms: 100
  # Take every N-th lidar beam for the UDP scan overlay. 1 = full ~360 pts,
  # 2 = ~180 pts (default; keeps each datagram under one MTU).
  scan_subsample: 2

battery:
  enabled: true

filter:
  ready: true
  target:
    has_wrap_around: false
    dominant_color: "107.55,132.957,65.2032"
    lower1: "99,51,3"
    upper1: "116,180,125"
    lower2: "0,0,0"
    upper2: "0,0,0"
  obstacles:
    count: 1
    0:
      has_wrap_around: false
      dominant_color: "164.624,185.367,111.432"
      lower1: "155,112,45"
      upper1: "173,208,164"
      lower2: "0,0,0"
      upper2: "0,0,0"